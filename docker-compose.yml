version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: streetview
      MYSQL_USER: streetview
      MYSQL_PASSWORD: streetview
    volumes:
      - db_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://streetview:streetview@db:3306/streetview
      JWT_SECRET: ${JWT_SECRET:-ganti-jwt-secret-di-production}
      STORAGE_DIR: /data/storage
      PORT: 3000
      NODE_ENV: production
    volumes:
      - storage_data:/data/storage

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - storage_data:/data/storage:ro

volumes:
  db_data:
  storage_data:
